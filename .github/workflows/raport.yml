name: Poranny Raport Giełdowy

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: 

jobs:
  analiza_rynku:
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie kodu
        uses: actions/checkout@v3

      - name: Instalacja srodowiska Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek
        run: pip install google-genai

      - name: Odpalenie bota Wilka z Wall Street
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python wilk_z_sokratesa.py
